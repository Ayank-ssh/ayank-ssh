name: Sync Contribution Graph

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Ayank-ssh
        run: python scripts/generate_contributions.py

      - name: Publish graph to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add --detach /tmp/gh-pages origin/gh-pages
          else
            git worktree add --detach /tmp/gh-pages
            git -C /tmp/gh-pages checkout --orphan gh-pages
          fi

          mkdir -p /tmp/gh-pages
          rm -f /tmp/gh-pages/contributions.svg
          cp dist/contributions.svg /tmp/gh-pages/contributions.svg

          cd /tmp/gh-pages
          git add contributions.svg
          git diff --cached --quiet || git commit -m "chore: sync contribution graph"
          git push origin HEAD:gh-pages
